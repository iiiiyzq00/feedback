<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学习机反馈与运营平台</title>
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; }
      .feishu-auth-boot {
        box-sizing: border-box;
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1d1e2c 0%, #2a3a5c 50%, #1a3a6e 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        opacity: 1;
        transition: opacity 180ms ease;
        contain: paint;
      }
      .feishu-auth-boot[hidden] { display: none; }
      .feishu-auth-boot.is-leaving { opacity: 0; pointer-events: none; }
      .feishu-auth-boot__card {
        box-sizing: border-box;
        width: 420px;
        min-height: 320px;
        padding: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      }
      .feishu-auth-boot__icon {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        margin-bottom: 24px;
        border-radius: 20px;
        background: rgba(51, 112, 255, 0.1);
      }
      .feishu-auth-spinner {
        box-sizing: border-box;
        width: 28px;
        height: 28px;
        border: 3px solid rgba(51, 112, 255, 0.22);
        border-top-color: #3370ff;
        border-radius: 50%;
        animation: feishu-auth-spin 0.8s linear infinite;
      }
      .feishu-auth-boot h1 { margin: 0; color: #303133; font-size: 24px; }
      .feishu-auth-boot p { margin: 12px 0 0; color: #606266; font-size: 15px; }
      .feishu-auth-boot small { margin-top: 8px; color: #909399; font-size: 13px; }
      @keyframes feishu-auth-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .feishu-auth-spinner { animation: none; } }
    </style>
  </head>
  <body>
    <!-- Vue 挂载前的静态回调遮罩：防止一次性码兑换与首个懒加载页面之间出现空白帧。 -->
    <div id="feishu-auth-boot" class="feishu-auth-boot" role="status" aria-live="polite" hidden>
      <div class="feishu-auth-boot__card">
        <div class="feishu-auth-boot__icon" aria-hidden="true"><span class="feishu-auth-spinner"></span></div>
        <h1>正在登录</h1>
        <p>正在安全建立飞书会话，请稍候</p>
        <small>完成后将自动进入平台</small>
      </div>
    </div>
    <!-- 注销重载遮罩：由 main.ts 根据 logged_out 参数显示，路由守卫完成回登录页后淡出。 -->
    <div id="logout-boot" class="feishu-auth-boot" role="status" aria-live="polite" hidden>
      <div class="feishu-auth-boot__card">
        <div class="feishu-auth-boot__icon" aria-hidden="true"><span class="feishu-auth-spinner"></span></div>
        <h1>正在退出</h1>
        <p>正在返回登录页面，请稍候</p>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

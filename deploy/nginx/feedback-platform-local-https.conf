# 本地 TLS 入口。证书与私钥由 mkcert 生成在被忽略的
# .runtime/tls 目录里，绝不入库。
server {
    listen 8088 ssl;
    http2 on;
    server_name 192.168.3.140 localhost 127.0.0.1 YangdeMacBook-Pro.local;

    ssl_certificate /Users/yang/Feedback_platform/feedback-platform/.runtime/tls/feedback-platform-local.pem;
    ssl_certificate_key /Users/yang/Feedback_platform/feedback-platform/.runtime/tls/feedback-platform-local-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:feedback_platform_tls:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    root /Users/yang/Feedback_platform/feedback-platform/frontend/dist;
    index index.html;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 8088;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    include /Users/yang/Feedback_platform/feedback-platform/deploy/nginx/frontend-cache.conf;
}

# 为仍从 HTTP 开始的调用方保留的可选兼容入口。
server {
    listen 8089;
    server_name 192.168.3.140 localhost 127.0.0.1 YangdeMacBook-Pro.local;
    return 308 https://$host:8088$request_uri;
}

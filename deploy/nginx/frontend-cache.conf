# 在提供 frontend/dist 的 server 块内 include 本文件。
# index.html 与 SPA 回退必须重新校验，否则发现不了新部署。
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'self'" always;
    try_files $uri =404;
}

# Vite 产物带内容哈希，跨版本保留是安全的。
location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# manifest 是部署元数据，不是公开的浏览器资源。
location ^~ /.vite/ {
    deny all;
}

# 无版本号的文件与前端路由一律重新校验 HTML 外壳。
location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'self'" always;
    try_files $uri $uri/ /index.html;
}

etag on;
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
